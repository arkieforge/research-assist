packages:
  - apps/*
  - scripts
allowBuilds:
  esbuild: true
  workerd: true
  "@tailwindcss/oxide": true
  # postinstall only prints a funding banner
  core-js: false
  core-js-pure: false
minimumReleaseAgeExclude:
  - "@clerk/backend@3.27.0"
  - "@clerk/react@6.18.6"
  - "@clerk/shared@4.44.1"
  - "@clerk/tanstack-react-start@1.7.11"
  - "@cloudflare/workers-types@5.20261106.1"
  - "@posthog/core@1.64.1"
  - "@posthog/types@1.421.1"
  - posthog-js@1.447.2
  - "@astrojs/internal-helpers@0.13.1"
  - "@astrojs/markdown-satteri@0.4.7"
  - astro@7.4.7
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
