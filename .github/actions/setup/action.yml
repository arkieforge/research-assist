name: Setup
description: Vite+ (vp, the Node from .node-version, pnpm) and a frozen install. Run after checkout.
inputs:
  filter:
    description: pnpm filter for a partial install (e.g. "@arkie/api..."). Empty installs everything.
    default: ""
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version: "1.5.0"
        node-version-file: .node-version
        cache: true
    - shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: vp install --frozen-lockfile ${FILTER:+--filter "$FILTER"}
