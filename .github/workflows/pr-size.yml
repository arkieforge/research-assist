name: PR size

# Labels PRs size:XS..XXL by changed lines, not counting lockfiles, migration snapshots and generated
# route trees. Context for reviewers, not a rule. pull_request_target with no checkout: it only reads
# the PR's file list, so fork PRs get labels too.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sizes = [
              ["size:XS", 10, "0e8a16"], ["size:S", 30, "5ebd3e"], ["size:M", 100, "fbca04"],
              ["size:L", 500, "fe7d37"], ["size:XL", 1000, "d93f0b"], ["size:XXL", Infinity, "b60205"],
            ];
            const ignored = [/pnpm-lock\.yaml$/, /migrations\/.*\/snapshot\.json$/, /routeTree\.gen\.ts$/];
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const lines = files
              .filter((f) => !ignored.some((re) => re.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const [name, , color] = sizes.find(([, max]) => lines < max);
            await github.rest.issues.createLabel({ owner, repo, name, color }).catch((e) => { if (e.status !== 422) throw e; });
            const current = context.payload.pull_request.labels.map((l) => l.name);
            for (const old of current.filter((l) => l.startsWith("size:") && l !== name)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: old });
            }
            if (!current.includes(name)) await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [name] });
            core.info(`${lines} changed lines -> ${name}`);
