name: API preview

# Label a same-repo PR `preview:api` to deploy Alchemy stage `pr-<n>`: its own Worker, D1, R2, queue,
# and a Neon branch of prod's project. This runs PR code with Doppler `stg` credentials, so every run
# waits for approval in the `preview` environment. Teardown (api-preview-cleanup.yml) never runs PR code.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pr-${{ github.event.pull_request.number }}
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:api') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:api')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Confirm the PR is still open and labeled
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,labels \
            --jq 'if .state == "OPEN" and any(.labels[]; .name == "preview:api") then "ok" else "stale" end')
          [ "$state" = ok ] || { echo "PR #$PR is no longer open with preview:api; not deploying." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
        with:
          filter: "@arkie/api..."
      - id: deploy
        name: alchemy deploy --stage pr-<n>
        working-directory: apps/api
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          vp exec alchemy deploy --stage "$STAGE" --yes --no-input | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/deploy.log" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- api-preview -->";
            const body = [
              marker,
              "### API preview",
              "",
              `${process.env.URL || "(URL not found in the deploy log)"} for ${process.env.SHA.slice(0, 7)}`,
              "",
              "This branch's next Vercel web preview uses it (`VITE_API_URL` is set per branch). Removing the",
              "`preview:api` label or closing the PR tears the stage down.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
