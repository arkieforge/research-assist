name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job per gate so failures read at a glance and run side by side. Branch protection requires only
# `CI`, which passes when every gate passed; add new jobs to its `needs`.
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: vp check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: vp run -r typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: vp run -r test

  build:
    name: Build web and marketing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # NITRO_PRESET matches what Vercel builds, so a Vercel-only build break fails here first.
      - run: vp run -r build
        env:
          NITRO_PRESET: vercel

  ci:
    name: CI
    if: ${{ always() }}
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # always(), not !cancelled(): a cancelled run must still report a failing check.
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
