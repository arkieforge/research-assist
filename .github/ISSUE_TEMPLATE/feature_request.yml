name: Feature request
description: Propose a capability or a change in behavior.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful? Describe the need, not only a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
